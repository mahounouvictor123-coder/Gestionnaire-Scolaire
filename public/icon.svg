<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon Badge -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gold Border Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="30%" stop-color="#EAB308" />
      <stop offset="70%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Shield Blue Metallic Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="40%" stop-color="#1D4ED8" />
      <stop offset="80%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Arc Blue Gradient -->
    <linearGradient id="blueArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Arc Green Gradient -->
    <linearGradient id="greenArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Rounded Square Container Background -->
  <rect x="0" y="0" width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <g filter="url(#dropShadow)" transform="translate(0, -10)">
    <!-- Outer Blue Arc Sweep (Top-Left) -->
    <path d="M 120 280 C 80 160 180 60 330 65 C 380 67 400 80 370 95 C 230 90 130 180 155 285 Z" fill="url(#blueArcGrad)" />

    <!-- Outer Green Arc Sweep (Bottom-Right) -->
    <path d="M 390 220 C 430 330 340 430 180 430 C 130 430 110 415 140 400 C 270 405 380 320 355 215 Z" fill="url(#greenArcGrad)" />

    <!-- GOLD SHIELD CREST OUTLINE -->
    <path d="M 256 75 C 330 100 375 110 380 180 C 380 290 320 370 256 415 C 192 370 132 290 132 180 C 137 110 182 100 256 75 Z" fill="url(#goldGrad)" />

    <!-- INNER BLUE SHIELD CREST -->
    <path d="M 256 92 C 318 114 358 122 362 182 C 362 278 310 350 256 392 C 202 350 150 278 150 182 C 154 122 194 114 256 92 Z" fill="url(#shieldGrad)" />

    <!-- GRADUATION CAP (MORTARBOARD) -->
    <!-- Cap Top Diamond -->
    <polygon points="256,120 325,145 256,170 187,145" fill="#0284C7" stroke="#FFFFFF" stroke-width="3" />
    <polygon points="256,124 315,145 256,164 197,145" fill="#1E3A8A" />
    <!-- Skull Cap Base -->
    <path d="M 215 158 L 215 180 C 215 192 297 192 297 180 L 297 158 Z" fill="#0F172A" />
    <!-- Cap Tassel -->
    <circle cx="256" cy="145" r="4" fill="#FDE047" />
    <path d="M 256 145 C 285 150 305 165 308 185" fill="none" stroke="#FDE047" stroke-width="4" stroke-linecap="round" />
    <rect x="304" y="183" width="8" height="16" rx="2" fill="#EAB308" />

    <!-- OPEN BOOK IN CENTER OF SHIELD -->
    <!-- Left Page -->
    <path d="M 256 265 C 220 240 180 245 165 255 L 165 200 C 185 190 225 188 256 210 Z" fill="#FFFFFF" />
    <!-- Right Page -->
    <path d="M 256 265 C 292 240 332 245 347 255 L 347 200 C 327 190 287 188 256 210 Z" fill="#F8FAFC" />
    <!-- Book Spine & Shadow -->
    <path d="M 253 210 L 253 266 L 259 266 L 259 210 Z" fill="#CBD5E1" />
    <path d="M 256 210 L 256 266" stroke="#94A3B8" stroke-width="2" />
    <!-- Book Border Accent -->
    <path d="M 165 255 C 180 245 220 240 256 265 C 292 240 332 245 347 255" fill="none" stroke="#0284C7" stroke-width="3" />

    <!-- THREE STUDENTS / PEOPLE AVATARS -->
    <!-- Center Main Avatar (Blue) -->
    <circle cx="256" cy="292" r="16" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
    <path d="M 230 342 C 230 315 282 315 282 342 Z" fill="#0284C7" stroke="#FFFFFF" stroke-width="2" />
    <!-- Tie for Center Avatar -->
    <polygon points="256,318 260,332 256,340 252,332" fill="#FDE047" />

    <!-- Left Avatar (Green) -->
    <circle cx="212" cy="305" r="13" fill="#4ADE80" stroke="#FFFFFF" stroke-width="2" />
    <path d="M 190 346 C 190 325 234 325 234 346 Z" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- Right Avatar (Green) -->
    <circle cx="300" cy="305" r="13" fill="#4ADE80" stroke="#FFFFFF" stroke-width="2" />
    <path d="M 278 346 C 278 325 322 325 322 346 Z" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5" />
  </g>

  <!-- Bottom Brand Title Banner inside Icon -->
  <text x="256" y="472" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="2">GESTIONNAIRE SCOLAIRE</text>
</svg>
